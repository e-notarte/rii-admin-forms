<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - R-II Builders Admin Request Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1E355F;
            --primary-dark: #152748;
            --accent: #FCAE16;
            --accent-hover: #e59c11;
            --bg: #f4f7f6;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #2d3748;
            --muted: #718096;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden;
        }

        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            z-index: -1;
            object-fit: cover;

            /* Increased brightness and added saturate */
            filter: brightness(0.85) saturate(1.5);
        }

        .login-container {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, var(--primary), var(--accent));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-header img {
            width: 80px;
            margin-bottom: 16px;
        }

        .brand-header h1 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .brand-header p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.2s;
            outline: none;
            background: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(30, 53, 95, 0.1);
        }

        .input-wrapper input:focus+i {
            color: var(--primary);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--accent);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            display: none;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                border-radius: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        .signup-prompt {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .signup-prompt a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: color 0.2s;
        }

        .signup-prompt a:hover {
            color: var(--accent);
        }

        .hidden-field {
            display: none;
        }
    </style>
</head>

<body>
    <video autoplay muted loop playsinline class="bg-video">
        <source src="RII_Video.mp4" type="video/mp4">
    </video>

    <div class="login-container">
        <div class="brand-header">
            <img src="https://riibuilders.b-cdn.net/wp-content/uploads/2025/09/cropped-RII-Logo-site-icon-192x192.png"
                alt="R-II Builders Logo">
            <h1>Welcome Back</h1>
            <p>Admin Request Management System</p>
        </div>

        <div class="error-message" id="errorMsg">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Invalid email or password.</span>
        </div>

        <form id="loginForm">

            <div class="form-group hidden-field" id="nameGroup">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name">
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required
                        autocomplete="current-password">
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <div class="options-row">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <div class="spinner"></div>
            </button>

            <div class="signup-prompt" id="signupPrompt">
                Don't have an account? <a href="#" id="toggleSignup">Sign Up</a>
            </div>

        </form>

        <div class="footer-text">
            © 2026 R-II Builders, Inc. All Rights Reserved.
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-client.js';

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = loginBtn.querySelector('.btn-text');
        const spinner = loginBtn.querySelector('.spinner');

        const toggleSignup = document.getElementById('toggleSignup');
        const nameGroup = document.getElementById('nameGroup');
        const fullNameInput = document.getElementById('fullName');
        const titleText = document.querySelector('.brand-header h1');
        const subtitleText = document.querySelector('.brand-header p');
        const signupPromptText = document.getElementById('signupPrompt');

        let isSignup = false;

        // Function to bind toggle listener
        function bindToggleListener() {
            document.getElementById('toggleSignup').addEventListener('click', (e) => {
                e.preventDefault();
                isSignup = !isSignup;

                if (isSignup) {
                    titleText.textContent = 'Create an Account';
                    subtitleText.textContent = 'Join Admin Request Management System';
                    btnText.textContent = 'Sign Up';
                    signupPromptText.innerHTML = 'Already have an account? <a href="#" id="toggleSignup">Sign In</a>';
                    nameGroup.style.display = 'block';
                    fullNameInput.required = true;
                } else {
                    titleText.textContent = 'Welcome Back';
                    subtitleText.textContent = 'Admin Request Management System';
                    btnText.textContent = 'Sign In';
                    signupPromptText.innerHTML = 'Don\'t have an account? <a href="#" id="toggleSignup">Sign Up</a>';
                    nameGroup.style.display = 'none';
                    fullNameInput.required = false;
                }
                bindToggleListener();
            });
        }

        bindToggleListener();

        if (localStorage.getItem('rememberedEmail')) {
            emailInput.value = localStorage.getItem('rememberedEmail');
            document.getElementById('rememberMe').checked = true;
        }

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            loginBtn.disabled = true;
            errorMsg.style.display = 'none';

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const fullName = fullNameInput.value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            try {
                if (isSignup) {
                    // Sign Up

                    // Domain restriction
                    const allowedDomains = ['@riibuilders.com.ph', '@rmrriibuilders.com.ph', '@rmrriibuilders.com', '@riibuilders.com'];
                    const isAllowedDomain = allowedDomains.some(domain => email.toLowerCase().endsWith(domain));

                    if (!isAllowedDomain) {
                        throw new Error('Only R-II Builders employee email addresses are allowed to register.');
                    }

                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: { full_name: fullName }
                        }
                    });

                    if (error) throw error;

                    alert('Registration successful! Please sign in.');
                    // Switch back to sign in
                    document.getElementById('toggleSignup').click();
                } else {
                    // Sign In
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) throw error;

                    // Fetch user role from profiles
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('role, full_name')
                        .eq('id', data.user.id)
                        .single();

                    const role = profile ? profile.role : 'user';
                    const fullName = profile && profile.full_name ? profile.full_name : 'User';

                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }

                    sessionStorage.setItem('isAuthenticated', 'true');
                    sessionStorage.setItem('userRole', role);
                    sessionStorage.setItem('userFullName', fullName);

                    window.location.href = 'welcome.html';
                }
            } catch (error) {
                errorMsg.style.display = 'flex';
                errorMsg.querySelector('span').textContent = error.message || 'Authentication failed.';
            } finally {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
